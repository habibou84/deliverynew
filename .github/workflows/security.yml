name: Sécurité

# Contrôles de sécurité automatiques (docs/SECURITE-OUTILS.md) :
# - failles connues des dépendances PHP (composer audit) et JavaScript (npm audit, paquets livrés seulement) ;
# - secrets (clés, mots de passe, jetons) écrits par erreur dans le code ou l'historique Git (gitleaks).
# Chaque lundi matin, à la main (Actions › Sécurité › Run workflow), et sur les PR qui changent les dépendances.
# Ce workflow est séparé de la CI : il ne bloque pas les fusions, il prévient (e-mail de GitHub en cas d'échec).
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - composer.lock
      - package-lock.json
      - .github/workflows/security.yml

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dépendances (failles connues)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: composer audit
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (paquets livrés aux navigateurs et aux téléphones)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secrets dans le code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (code et historique)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          # Rapport sans les valeurs (--redact) : le journal des Actions ne doit pas recopier un secret trouvé
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
