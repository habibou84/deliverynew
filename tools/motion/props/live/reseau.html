<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1"><style>
/* Compte d'une e-commerçante sur un réseau social (dessin neutre, sans marque) : ?n=profil | bio | live */
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#0b0b0f;color:#fff}
.top{padding:50px 16px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.head{display:flex;flex-direction:column;align-items:center;padding:14px 16px 6px;gap:6px}
.av{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#be185d);display:grid;place-items:center;font-size:42px;border:3px solid #fff2}
.name{font-size:19px;font-weight:800}.handle{font-size:14px;color:#a1a1aa}
.stats{display:flex;gap:26px;margin-top:6px;text-align:center}.stats b{display:block;font-size:17px}.stats span{font-size:12.5px;color:#a1a1aa}
.btns{display:flex;gap:8px;margin-top:8px}.btns span{background:#27272a;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700}.btns .main{background:#e11d48}
.bio{text-align:center;font-size:14.5px;line-height:1.45;padding:8px 22px 4px;color:#e4e4e7}
.link{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:800;color:#fff;background:#ffffff14;border-radius:999px;padding:6px 12px;font-size:14px}
.on .link{background:#e11d48;box-shadow:0 0 0 4px #e11d4855}
.tabs{display:flex;justify-content:space-around;border-bottom:1px solid #27272a;margin-top:12px;font-size:20px;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.post{aspect-ratio:3/4;position:relative;overflow:hidden;background:#18181b}
.post img{width:100%;height:100%;object-fit:cover;object-position:top}
.pin{position:absolute;left:5px;top:5px;background:#e11d48;border-radius:5px;font-size:11px;font-weight:800;padding:2px 6px}
.views{position:absolute;left:5px;bottom:4px;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
.p2{background:linear-gradient(160deg,#334155,#0f172a)}.p3{background:linear-gradient(160deg,#78350f,#1c1917)}.p4{background:linear-gradient(160deg,#4c1d95,#111827)}.p5{background:linear-gradient(160deg,#065f46,#0b0b0f)}.p6{background:linear-gradient(160deg,#9f1239,#18181b)}
.first{outline:3px solid transparent}.profil .first{outline-color:#e11d48;outline-offset:-3px}
/* Live */
.live{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 30%,#c2410c 0%,#7c2d12 35%,#1c1917 75%)}
.seller{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:230px;height:420px;border-radius:120px 120px 30px 30px;background:linear-gradient(180deg,#3f1d0b,#1f0d05);opacity:.9}
.seller::before{content:"";position:absolute;left:50%;top:-80px;transform:translateX(-50%);width:120px;height:140px;border-radius:50%;background:#4a2511}
.dress{position:absolute;left:50%;top:330px;transform:translateX(-50%);width:170px;height:200px;border-radius:20px;background:repeating-radial-gradient(circle at 30% 30%,#f59e0b 0 10px,#0f766e 10px 20px,#b91c1c 20px 28px);box-shadow:0 10px 30px #0008}
.lhead{position:absolute;top:50px;left:14px;right:14px;display:flex;align-items:center;gap:8px}
.lhead .av{width:38px;height:38px;font-size:18px;border-width:2px}
.lhead b{font-size:14px;display:block}.lhead small{font-size:12px;color:#fde68a}
.badge{margin-left:auto;background:#e11d48;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:900}
.viewers{background:#0006;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.comments{position:absolute;left:12px;right:70px;bottom:74px;display:flex;flex-direction:column;gap:8px}
.c{font-size:14px;line-height:1.3;text-shadow:0 1px 2px #000}.c b{color:#fde68a;margin-right:6px}
.pinned{background:#000a;border:2px solid #e11d48;border-radius:12px;padding:8px 10px;font-size:14.5px;line-height:1.35;box-shadow:0 0 0 4px #e11d4840}
.pinned small{display:block;font-size:11.5px;color:#fda4af;font-weight:800;margin-bottom:2px}
.bar{position:absolute;left:12px;right:12px;bottom:22px;display:flex;gap:8px;align-items:center}
.bar div{flex:1;background:#ffffff22;border-radius:999px;padding:10px 14px;color:#d4d4d8;font-size:14px}
.side{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;gap:16px;font-size:26px;text-align:center}
</style></head><body>
<div id="app"></div>
<script>
const n = new URLSearchParams(location.search).get('n') || 'profil'
const app = document.getElementById('app')
document.body.className = n
if (n === 'live') {
  app.innerHTML = `<div class="live"><div class="seller"></div><div class="dress"></div>
  <div class="lhead"><div class="av">👗</div><div><b>Boutique Chic Abidjan</b><small>Vendredi mode</small></div><span class="badge">EN DIRECT</span><span class="viewers">👁 312</span></div>
  <div class="side"><span>❤️</span><span>💬</span><span>↗</span></div>
  <div class="comments">
    <div class="c"><b>aya_k</b>Elle est trop belle la robe 😍</div>
    <div class="c"><b>mariam.t</b>Le sac c'est combien ?</div>
    <div class="c"><b>fatou_d</b>A2 svp !</div>
    <div class="pinned"><small>📌 ÉPINGLÉ PAR BOUTIQUE CHIC</small>Pour commander, envoyez le code (A1, A2…) sur WhatsApp : <b>07 07 08 09 10</b></div>
  </div>
  <div class="bar"><div>Ajouter un commentaire…</div><span style="font-size:24px">🎁</span></div></div>`
} else {
  const on = n === 'bio' ? 'on' : ''
  app.innerHTML = `<div class="top"><span>‹</span><span>Boutique Chic Abidjan</span><span>⋯</span></div>
  <div class="head"><div class="av">👗</div><div class="name">Boutique Chic Abidjan</div><div class="handle">@boutiquechic</div>
    <div class="stats"><div><b>184</b><span>Abonnements</span></div><div><b>12,4 k</b><span>Abonnés</span></div><div><b>96 k</b><span>J'aime</span></div></div>
    <div class="btns"><span class="main">Suivre</span><span>Message</span></div></div>
  <div class="bio ${on}">Robes, sacs et chaussures · Livraison partout à Abidjan 🛵<br>Live tous les vendredis à 20 h<br><span class="link">🔗 boutique-chic.jibiat.com/l/7Kq2xA</span></div>
  <div class="tabs"><span>▦</span><span>❤</span><span>🔒</span></div>
  <div class="grid">
    <div class="post first"><img src="etiquette.png" alt=""><span class="pin">📌 Épinglé</span><span class="views">▶ 2 418</span></div>
    <div class="post p2"><span class="views">▶ 1 102</span></div><div class="post p3"><span class="views">▶ 864</span></div>
    <div class="post p4"><span class="views">▶ 3 270</span></div><div class="post p5"><span class="views">▶ 742</span></div><div class="post p6"><span class="views">▶ 1 590</span></div>
  </div>`
}
</script>
</body></html>
